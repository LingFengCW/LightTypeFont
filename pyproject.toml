[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litf"
version = "1.4.0"
description = "LightType Font (LITF) -- a lightweight open vector font format based on SVG cubic Bezier paths."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LITF Contributors" }]
keywords = ["font", "litf", "lighttype", "svg", "vector", "typeface"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = ["fonttools>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
litf = "litf.cli:main"

[tool.setuptools]
packages = ["litf"]
